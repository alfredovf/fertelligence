name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Tipos (core y worker)
        run: npm run typecheck -w @fertelligence/core -w @fertelligence/worker
      - name: Pruebas
        run: npm test
      - name: Build de la web (incluye revisión de tipos)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t fertelligence:ci .
