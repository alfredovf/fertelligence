name: fertelligence

x-app: &app
  image: fertelligence:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://fertelligence:fertelligence@db:5432/fertelligence
    S3_ENDPOINT: http://storage:9000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fertelligence
      POSTGRES_PASSWORD: fertelligence
      POSTGRES_DB: fertelligence
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fertelligence"]
      interval: 3s
      timeout: 3s
      retries: 20

  # RustFS: almacenamiento compatible con S3 (MinIO dejó de publicar imágenes de Docker).
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: fertelligence
      RUSTFS_SECRET_KEY: fertelligence-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: sh -c "npm run db:deploy && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *app
    command: npm run start -w @fertelligence/worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
